<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{

header{position:sticky;top:0;z-index:20;background:rgba(15,15,14,.92);backdrop-filter:blur(14px);

.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto}
.htitle{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}

h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.02em}

h3{font-size:13px;margin:20px 0 8px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
p{margin:0 0 12px;color:var(--tx2);font-size:14.5px}
p strong,li strong{color:var(--tx)}
ul{margin:0 0 14px;padding-left:19px;color:var(--tx2);font-size:14.5px}
li{margin-bottom:6px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:15px 16px;margin-bottom:11px}
.card.tight{padding:12px 14px}
.muted{color:var(--tx3);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px 13px}

button,.btn{font-family:inherit;font-size:14.5px;font-weight:600;border-radius:11px;border:1px solid var(--bd);

.btn-p{background:var(--tx);color:#0f0f0e;border-color:var(--tx)}
.btn-g{background:var(--green);border-color:var(--green);color:#fff}
.btn-s{padding:8px 12px;font-size:13px;border-radius:9px}
.btn-w{width:100%}
.btn-gh{background:none;border:1px solid var(--bd);color:var(--tx2)}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--s2);border:1px solid var(--bd);
  color:var(--tx);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select,textarea:focus{outline:none;border-color:var(--tx3)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,15,14,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--bd);padding:7px 0 calc(7px + var(--safe-b));display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:none;padding:5px 0 2px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--tx3);font-size:10.5px;font-weight:600;letter-spacing:.01em}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

section{display:none;animation:fade .18s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.ex{background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ex.done{border-color:var(--green)}
.ex-h{padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.ex-n{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.ex-m{font-size:12.5px;color:var(--tx3);margin-top:2px}
.tick{width:26px;height:26px;flex:none;border-radius:8px;border:1.8px solid var(--bd);background:var(--s2);
  display:grid;place-items:center;margin-top:1px}
.ex.done .tick{background:var(--green);border-color:var(--green)}
.tick svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ex.done .tick svg{opacity:1}
.sets{padding:0 15px 13px;display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;align-items:center}
.set .i{font-size:12px;color:var(--tx3);font-weight:700;text-align:center}
.set input{padding:9px 10px;text-align:center;font-size:15px}
.set input.filled{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--s2))}
.set .sd{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--bd);background:var(--s2);
  display:grid;place-items:center;padding:0}
.set .sd.on{background:var(--green);border-color:var(--green)}
.set .sd svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;opacity:.25}
.set .sd.on svg{opacity:1}
.setshead{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;font-size:10px;text-transform:uppercase;

.note{font-size:12.5px;color:var(--tx3);padding:0 15px 12px;margin-top:-4px}

.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.p-f{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue)}
.p-c{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange)}
.p-r{background:var(--s2);color:var(--tx3)}
.p-d{background:color-mix(in srgb,var(--yellow) 20%,transparent);color:var(--yellow)}
.bar{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin:9px 0 3px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);

td{padding:9px 8px;border-bottom:1px solid var(--bd);color:var(--tx2);vertical-align:top}
td.k{color:var(--tx);font-weight:600}
tr:last-child td{border-bottom:none}
.box{border-left:3px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 8%,var(--s1));

.box.g{border-left-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--s1))}
.box.r{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--s1))}
/* cronómetro */
#timer{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:40;max-width:616px;margin:0 auto;
  background:var(--s3);border:1px solid var(--bd);border-radius:15px;padding:12px 15px;display:none;
  align-items:center;gap:12px;box-shadow:0 10px 34px rgba(0,0,0,.55)}
#timer.on{display:flex}
#timer .t{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:74px}
#timer .lab{font-size:11.5px;color:var(--tx3);flex:1}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:15px;font-size:12px;color:var(--tx2);margin-bottom:9px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;background:var(--s2);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;background:none;border:none;padding:8px 4px;font-size:13px;border-radius:9px;color:var(--tx3)}
.tabs button.on{background:var(--s3);color:var(--tx)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b));z-index:60;
  background:var(--tx);color:#0f0f0e;font-size:13.5px;font-weight:650;padding:10px 17px;border-radius:99px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
details{background:var(--s1);border:1px solid var(--bd);border-radius:13px;margin-bottom:9px;overflow:hidden}
details summary{padding:13px 15px;font-size:14.5px;font-weight:650;cursor:pointer;list-style:none;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;color:var(--tx3);font-size:19px;font-weight:400}
details[open] summary::after{content:"–"}
details .db{padding:0 15px 14px;border-top:1px solid var(--bd);padding-top:12px}
/* modal / hoja inferior */
#modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
#modal.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--s1);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;
  padding:8px 16px calc(22px + var(--safe-b));max-width:640px;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;background:var(--s3);border-radius:99px;margin:6px auto 14px}
.sh-t{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px}
.sh-s{font-size:12.5px;color:var(--tx3);margin:0 0 16px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);
  font-weight:700;margin-bottom:5px}
.gbox{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.gbox .gt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:700;margin-bottom:5px}
.gbox p{margin:0;font-size:14px;color:var(--tx2)}
.gbox.err{border-left:3px solid var(--red)}
.gbox.ok{border-left:3px solid var(--green)}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:var(--s2);border:1px solid var(--bd);
  border-radius:12px;overflow:hidden;margin-bottom:9px;display:grid;place-items:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.info{width:26px;height:26px;flex:none;border-radius:99px;border:1.5px solid var(--bd);background:var(--s2);
  color:var(--tx3);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0;font-style:italic}
.info.sw{font-style:normal;font-size:14px;margin-right:-3px}

.ring{display:flex;gap:12px;align-items:center}
.meal{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:11px 13px;margin-bottom:8px;

.meal .mi{flex:1;min-width:0}
.meal .mn{font-size:14px;font-weight:620;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .mm{font-size:12px;color:var(--tx3);margin-top:1px}
.meal .mk{font-size:15px;font-weight:700;text-align:right;line-height:1.2}
.meal .mp{font-size:11px;color:var(--tx3);text-align:right}
.xbtn{width:28px;height:28px;flex:none;border-radius:8px;background:none;border:none;color:var(--tx3);font-size:19px;padding:0}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sug button{font-size:12.5px;padding:7px 11px;border-radius:99px;font-weight:600}
.spin{width:17px;height:17px;border:2px solid var(--s3);border-top-color:var(--tx);border-radius:50%;

.res{max-height:190px;overflow-y:auto;border:1px solid var(--bd);border-radius:11px;margin-top:7px}
.res div{padding:10px 12px;border-bottom:1px solid var(--bd);font-size:13.5px;color:var(--tx2)}
.res div:last-child{border:none}
.res div b{color:var(--tx);font-weight:600}
/* menú, recetas e ingredientes */
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:8px 12px;white-space:nowrap}
.slot{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.slot .sl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:700}
.slot .sn{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.slot .sm{font-size:12.5px;color:var(--tx3);margin-top:2px}
.inglist{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:2px 12px}
.ingr{display:grid;grid-template-columns:1fr 86px 28px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.ingr:last-child{border-bottom:none}
.ingr .inn{font-size:13.5px;line-height:1.35;min-width:0}
.ingr .ing{position:relative}
.ingr .ing input{padding:8px 26px 8px 10px;text-align:right;font-size:15px}
.ingr .ing span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--tx3)}
.inglist p{padding:10px 0}
textarea{resize:vertical;line-height:1.45}
</style>
</head>

const KEY='juandePlan_v1';
let D = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.v===1) return r; }catch(err){}
  return {v:1, offset:0, log:{}, peso:{}, cintura:{}, notas:{}, comidas:{}, favs:[], cambios:{}, veto:[], api:{key:'',model:'claude-haiku-4-5'}};
}
// compatibilidad con copias antiguas
if(!D.comidas) D.comidas={}; if(!D.favs) D.favs=[];
if(!D.api) D.api={key:'',model:'claude-haiku-4-5'};
if(!D.cambios) D.cambios={}; if(!D.veto) D.veto=[];
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(err){ toast('No se pudo guardar'); }
},120); }

/* ══════════════════ FECHAS Y CICLO ══════════════════ */
const DAY=86400000;
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function hoyISO(){ return iso(new Date()); }
function diasDesde(a,b){ return Math.round((parse(b)-parse(a))/DAY); }
function estado(fecha){
  const n = diasDesde(START, fecha) + D.offset;
  const i = n<0 ? 0 : n;
  return { dia: (i%10)+1, ciclo: Math.floor(i/10)+1, abs:i };
}
function variante(ciclo){ return ['A','B','C'][(ciclo-1)%3]; }
function descarga(ciclo){ return ciclo>=6 && ciclo%3===0; }
function bloque(ciclo){ return BLOQUES.find(b=>ciclo>=b.c[0]&&ciclo<=b.c[1]) || BLOQUES[BLOQUES.length-1]; }
function semanaPlan(fecha){ return Math.floor(diasDesde(START,fecha)/7); }
function fmtFecha(s){
  const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const d=parse(s); return d.getDate()+' '+M[d.getMonth()];
}
function diaSemana(s){ return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][parse(s).getDay()]; }

/* fecha que se está viendo (por defecto hoy) */
let VER = hoyISO();

/* ══════════════════ UTILIDADES UI ══════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1700); }
function vibra(ms){ if(navigator.vibrate) try{navigator.vibrate(ms)}catch(err){} }
const CHECK='<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';

/* ══════════════════ CRONÓMETRO ══════════════════ */
let tInt=null, tLeft=0;
function startT(s,lab){
  tLeft=s; $('#tLab').textContent=lab||'Descanso'; $('#timer').classList.add('on'); pintaT();
  clearInterval(tInt);
  tInt=setInterval(()=>{ tLeft--; pintaT();
    if(tLeft<=0){ clearInterval(tInt); vibra([200,90,200]); $('#tVal').textContent='¡Ya!';
      setTimeout(stopT,1600); } },1000);
}
function pintaT(){ const m=Math.floor(tLeft/60), s=tLeft%60; $('#tVal').textContent=m+':'+String(s).padStart(2,'0'); }
function addT(s){ tLeft+=s; pintaT(); }
function stopT(){ clearInterval(tInt); $('#timer').classList.remove('on'); }

/* ══════════════════ VISTA: HOY ══════════════════ */
function claveDia(f){ const st=estado(f); return 'c'+st.ciclo+'d'+st.dia; }

function renderHoy(){
  const f=VER, st=estado(f), P=PLAN[st.dia], vr=variante(st.ciclo), V=P.v[vr];
  const dl=descarga(st.ciclo)&&st.dia<=5, bl=bloque(st.ciclo);
  const key=claveDia(f), L=D.log[key]||{};
  const esHoy = f===hoyISO();
  const pillK={fuerza:'p-f',cardio:'p-c',suave:'p-r',descanso:'p-r'}[P.k];

  let h='';
  // navegación de día
  h+=`<div class="row between" style="margin-bottom:14px">
    <button class="btn-s btn-gh" onclick="mueveDia(-1)">‹ Anterior</button>
    <div style="text-align:center">
      <div style="font-size:13.5px;font-weight:650">${esHoy?'Hoy':fmtFecha(f)}</div>
      <div class="muted" style="font-size:11.5px">${diaSemana(f)} ${esHoy?'· '+fmtFecha(f):''}</div>
    </div>
    <button class="btn-s btn-gh" onclick="mueveDia(1)">Siguiente ›</button>
  </div>`;

  // cabecera de sesión
  h+=`<div class="card">
    <div class="row between" style="align-items:flex-start">
      <div style="flex:1">
        <div class="row" style="gap:7px;margin-bottom:6px">
          <span class="pill ${pillK}">Día ${st.dia}</span>
          <span class="pill p-r">Ciclo ${st.ciclo}</span>
          <span class="pill p-r">Variante ${vr}</span>
          ${dl?'<span class="pill p-d">Descarga</span>':''}
        </div>
        <div style="font-size:19px;font-weight:700;letter-spacing:-.025em;line-height:1.25">${esc(P.n)}</div>
        <div class="muted" style="margin-top:3px">${esc(V.t)} · ${P.d}</div>
      </div>
    </div>`;
  if(dl) h+=`<div class="box" style="margin:12px 0 0">Ciclo de descarga: haz solo el <strong>60 % de las series</strong> con el mismo peso. No es opcional — es lo que evita el estancamiento y las lesiones.</div>`;
  if(P.note) h+=`<div class="muted" style="margin-top:11px;line-height:1.5">${esc(P.note)}</div>`;
  h+=`</div>`;

  if(P.w) h+=`<details><summary>Calentamiento</summary><div class="db"><p style="margin:0">${esc(P.w)}</p></div></details>`;

  // progreso
  const EX=exDia(st.dia,vr);
  const total=EX.length, hechos=EX.filter((_,i)=>L['e'+i]&&L['e'+i].done).length;
  h+=`<div class="card tight">
    <div class="row between"><div style="font-size:13.5px;font-weight:650">${hechos} de ${total} ejercicios</div>
    <div class="muted">${Math.round(hechos/total*100)}%</div></div>
    <div class="bar"><i style="width:${hechos/total*100}%"></i></div>
  </div>`;

  // ejercicios
  h+=`<h3>La sesión</h3>`;
  EX.forEach((x,i)=>{
    const le=L['e'+i]||{sets:[]};
    const done=!!le.done;
    const logable = P.k==='fuerza' && x.s>1 && !/min|s$|✓|total|est\.|de cada|desc\./.test(x.r);
    h+=`<div class="ex ${done?'done':''}" id="ex${i}">
      <div class="ex-h">
        <div class="tick" onclick="toggleEx(${i})">${CHECK}</div>
        <div style="flex:1" onclick="toggleEx(${i})">
          <div class="ex-n">${esc(x.n)}</div>
          <div class="ex-m">${x.s>1?x.s+' × ':''}${esc(x.r)}</div>
        </div>
        <button class="info sw" onclick="event.stopPropagation();cambiaEjercicio(${st.dia},'${vr}',${i})" aria-label="Cambiar ejercicio">⇄</button>
        <button class="info" onclick="event.stopPropagation();fichaEjercicio(${st.dia},'${vr}',${i})" aria-label="Cómo se hace">i</button>
      </div>`;
    if(x.sw) h+=`<div class="note">En lugar de ${esc(x.sw)} · <span onclick="deshaceEj(${st.dia},'${vr}',${i})" style="text-decoration:underline">volver al original</span></div>`;
    else if(x.nt) h+=`<div class="note">${esc(x.nt)}</div>`;
    if(logable){
      h+=`<div class="setshead"><div></div><div>Peso (kg)</div><div>Reps</div><div></div></div><div class="sets">`;
      for(let s=0;s<x.s;s++){
        const sv=le.sets&&le.sets[s]||{};
        h+=`<div class="set">
          <div class="i">${s+1}</div>
          <input type="number" inputmode="decimal" step="0.5" placeholder="—" value="${sv.w??''}" class="${sv.w?'filled':''}" onchange="setVal(${i},${s},'w',this.value)">
          <input type="number" inputmode="numeric" placeholder="—" value="${sv.r??''}" class="${sv.r?'filled':''}" onchange="setVal(${i},${s},'r',this.value)">
          <button class="sd ${sv.ok?'on':''}" onclick="setOk(${i},${s})">${CHECK}</button>
        </div>`;
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  });

  // récords del día anterior
  const prev = ultimaVez(st.dia, vr, st.ciclo);
  if(prev) h+=`<details><summary>La última vez que hiciste esta sesión</summary><div class="db">${prev}</div></details>`;

  // cronómetro rápido
  if(P.k==='fuerza'){
    h+=`<h3>Descanso entre series</h3>
    <div class="grid3" style="margin-bottom:12px">
      <button onclick="startT(60,'Descanso 60 s')">60 s</button>
      <button onclick="startT(90,'Descanso 90 s')">90 s</button>
      <button onclick="startT(120,'Descanso 2 min')">2 min</button>
    </div>`;
  }

  // nota libre
  h+=`<h3>Notas del día</h3>
  <textarea rows="2" placeholder="Cómo te has sentido, molestias, rondas hechas…" onchange="setNota(this.value)">${esc(D.notas[key]||'')}</textarea>`;

  // terminar
  const fin = L.fin;
  h+=`<div style="margin:16px 0 8px">
    <button class="btn-w ${fin?'btn-g':'btn-p'}" onclick="terminar()">${fin?'✓ Sesión completada':'Marcar sesión como completada'}</button>
  </div>`;
  if(esHoy && st.dia!==10) h+=`<button class="btn-w btn-gh" style="margin-bottom:10px" onclick="saltar()">Hoy no puedo entrenar — mover el ciclo un día</button>`;

  $('#v-hoy').innerHTML=h;
  $('#hTitle').textContent = esHoy?'Hoy':fmtFecha(f);
  $('#hSub').textContent = P.n+' · '+bl.n;
  $('#hChip').textContent = 'D'+st.dia+' · C'+st.ciclo;
}

function ultimaVez(dia,vr,ciclo){
  for(let c=ciclo-3;c>=1;c-=3){
    const L=D.log['c'+c+'d'+dia];
    if(L&&L.fin){
      let out='<table>';
      exDia(dia,vr).forEach((x,i)=>{
        const le=L['e'+i]; if(!le||!le.sets) return;
        const s=le.sets.filter(v=>v&&v.w).map(v=>v.w+'×'+(v.r||'?')).join(' · ');
        if(s) out+=`<tr><td class="k">${esc(le.n||x.n)}</td><td>${esc(s)}</td></tr>`;
      });
      out+='</table>';
      return out.includes('<tr>') ? `<p class="muted" style="margin:0 0 8px">Ciclo ${c}</p>`+out : null;
    }
  }
  return null;
}

function mueveDia(n){ const d=parse(VER); d.setDate(d.getDate()+n); VER=iso(d); renderHoy(); window.scrollTo({top:0}); }
function toggleEx(i){
  const k=claveDia(VER); D.log[k]=D.log[k]||{};
  const le=D.log[k]['e'+i]=D.log[k]['e'+i]||{sets:[]};
  le.done=!le.done; if(le.done) vibra(18);
  save(); renderHoy();
}
function setVal(i,s,campo,val){
  const k=claveDia(VER); D.log[k]=D.log[k]||{};
  const le=D.log[k]['e'+i]=D.log[k]['e'+i]||{sets:[]};
  le.n=nombreEj(i);
  le.sets[s]=le.sets[s]||{}; le.sets[s][campo]= val===''?undefined:Number(val);
  save();
}
function setOk(i,s){
  const k=claveDia(VER); D.log[k]=D.log[k]||{};
  const le=D.log[k]['e'+i]=D.log[k]['e'+i]||{sets:[]};
  le.n=nombreEj(i);
  le.sets[s]=le.sets[s]||{}; le.sets[s].ok=!le.sets[s].ok;
  if(le.sets[s].ok){ vibra(15); startT(90,'Descanso 90 s'); }
  // autocompleta el peso de la serie anterior si está vacío
  if(le.sets[s].ok && le.sets[s].w===undefined && s>0 && le.sets[s-1]) le.sets[s].w=le.sets[s-1].w;
  save(); renderHoy();
}
function setNota(v){ D.notas[claveDia(VER)]=v; save(); }
function terminar(){
  const k=claveDia(VER); D.log[k]=D.log[k]||{};
  D.log[k].fin = D.log[k].fin ? null : VER;
  if(D.log[k].fin){ vibra([30,60,30]); toast('Sesión guardada'); }
  save(); renderHoy();
}
function saltar(){
  if(!confirm('La sesión de hoy pasará a mañana y todo el ciclo se retrasa un día. ¿Seguro?')) return;
  D.offset--; save(); toast('Sesión movida a mañana');
  const d=new Date(); d.setDate(d.getDate()+1); VER=iso(d);
  renderHoy(); renderCiclo();
}

    <li><strong>Unilateral:</strong> a una mano o a una pierna.</li>
    <li><strong>Rango:</strong> pies o manos elevados para alargar el recorrido.</li>

  <h3>Si un día no puedes</h3>

/* ══════════════════ VISTA: PESO ══════════════════ */
function media7(f){
  let s=0,n=0; const d=parse(f);
  for(let i=0;i<7;i++){ const k=iso(new Date(d-i*DAY)); if(D.peso[k]!==undefined){ s+=D.peso[k]; n++; } }
  return n?s/n:null;
}
function ultimoPeso(){
  const ks=Object.keys(D.peso).sort(); return ks.length?D.peso[ks[ks.length-1]]:null;
}
function renderPeso(){
  const hoy=hoyISO(), m7=media7(hoy), act=m7??ultimoPeso()??PESO0;
  const sem=Math.max(0,Math.min(26,semanaPlan(hoy))), obj=CURVA[sem];
  const dif=act-obj, perd=PESO0-act;
  const dBoda=Math.max(0,diasDesde(hoy,BODA));

  let h=`<div class="grid2" style="margin-bottom:10px">
    <div class="stat"><div class="l">Peso actual</div><div class="v">${act.toFixed(1)} kg</div>
      <div class="n">${m7?'media de 7 días':'último pesaje'}</div></div>
    <div class="stat"><div class="l">Perdido</div><div class="v" style="color:${perd>0?'var(--green)':'var(--tx)'}">${perd>0?'−':''}${Math.abs(perd).toFixed(1)} kg</div>
      <div class="n">desde el 18 de agosto</div></div>
  </div>
  <div class="grid3" style="margin-bottom:14px">
    <div class="stat"><div class="l">Objetivo hoy</div><div class="v" style="font-size:19px">${obj.toFixed(1)}</div>
      <div class="n" style="color:${dif<=.3?'var(--green)':dif<=1.5?'var(--yellow)':'var(--red)'}">${dif>0?'+':''}${dif.toFixed(1)} kg</div></div>
    <div class="stat"><div class="l">Falta</div><div class="v" style="font-size:19px">${Math.max(0,act-META).toFixed(1)}</div><div class="n">kg hasta 82,5</div></div>
    <div class="stat"><div class="l">Boda</div><div class="v" style="font-size:19px">${dBoda}</div><div class="n">días · IMC ${imc.toFixed(1)}</div></div>
  </div>`;

  // progreso global
  const pct=Math.max(0,Math.min(100,perd/(PESO0-META)*100));
  h+=`<div class="card tight"><div class="row between"><div style="font-size:13.5px;font-weight:650">Camino recorrido</div>
    <div class="muted">${pct.toFixed(0)}% de los 25,5 kg</div></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;

  // registrar
  h+=`<h3>Pésate hoy</h3>
  <div class="card">
    <div class="row" style="gap:9px">
      <input type="number" inputmode="decimal" step="0.1" id="inPeso" placeholder="${act.toFixed(1)}" value="${D.peso[hoy]??''}">
      <button class="btn-p" style="white-space:nowrap" onclick="guardaPeso()">Guardar</button>
    </div>
    <div class="muted" style="margin-top:9px">En ayunas, después del baño, sin ropa. El dato de un día oscila 1-2 kg por agua: lo que importa es la media de 7 días.</div>
  </div>`;

  // gráfico
  h+=`<h3>La curva</h3>
  <div class="legend"><span><i style="background:var(--blue)"></i>Plan</span><span><i style="background:var(--orange)"></i>Tu media de 7 días</span></div>
  <div class="card" style="padding:14px 10px">${grafico()}</div>`;

  // cintura
  h+=`<h3>Cintura</h3>
  <div class="card">
    <div class="row" style="gap:9px">
      <input type="number" inputmode="decimal" step="0.5" id="inCint" placeholder="cm" value="${D.cintura[hoy]??''}">
      <button class="btn-p" style="white-space:nowrap" onclick="guardaCint()">Guardar</button>
    </div>
    <div class="muted" style="margin-top:9px">Cada 10 días, a la altura del ombligo, relajado. <strong>Si la cintura baja y el peso no, estás ganando músculo y perdiendo grasa</strong> — eso es un éxito, no un fracaso.</div>
    ${cintTabla()}

  // hitos
  h+=`<h3>Hitos por semana</h3><table><tr><th>Sem</th><th>Fecha</th><th>Plan</th><th>Real</th></tr>`;
  CURVA.forEach((v,i)=>{
    const d=parse(START); d.setDate(d.getDate()+i*7); const fk=iso(d);
    const r=media7(fk);
    const pas = diasDesde(hoy,fk)<=0;
    h+=`<tr><td class="k">${i}</td><td>${fmtFecha(fk)}${HITOS[i]?'<br><span class="muted" style="font-size:11px">'+esc(HITOS[i])+'</span>':''}</td>
      <td>${v.toFixed(1)}</td><td style="color:${r?(r-v<=.3?'var(--green)':r-v<=1.5?'var(--yellow)':'var(--red)'):'var(--tx3)'}">${r?r.toFixed(1):(pas?'—':'')}</td></tr>`;
  });

  h+=`<h3>Cuando se estanque</h3>

    <li><strong>Revisa si has dejado de pesar la comida.</strong> El 90 % de los casos son calorías coladas.</li>
    <li><strong>Sube los pasos a 12.000.</strong> Al adelgazar te mueves menos sin darte cuenta.</li>
    <li><strong>Duerme.</strong> Dos semanas malas de sueño paran la báscula solas.</li>
    <li><strong>Solo entonces</strong> baja 150 kcal (nunca más) o añade un día de cardio suave.</li>
  </ul>
  <div class="box r" style="margin:12px 0 0">Nunca: bajar de 1.800 kcal, quitar proteína, ayunos largos o dos días de HIIT seguidos. Aceleran dos semanas y te frenan dos meses.</div></div>`;

  $('#v-peso').innerHTML=h;
}
function guardaPeso(){
  const v=parseFloat($('#inPeso').value);
  if(isNaN(v)||v<40||v>250){ toast('Peso no válido'); return; }
  D.peso[hoyISO()]=v; save(); vibra(20); toast('Peso guardado'); renderPeso(); renderDieta(); renderMas();
}
function guardaCint(){
  const v=parseFloat($('#inCint').value);
  if(isNaN(v)||v<50||v>200){ toast('Medida no válida'); return; }
  D.cintura[hoyISO()]=v; save(); toast('Cintura guardada'); renderPeso();
}
function cintTabla(){
  const ks=Object.keys(D.cintura).sort().slice(-6);
  if(!ks.length) return '';
  let h='<table style="margin-top:12px">';
  ks.reverse().forEach((k,i)=>{
    const prev=ks[i+1]!==undefined?D.cintura[ks[i+1]]:null;
    const d=prev!==null?D.cintura[k]-prev:null;
    h+=`<tr><td class="k">${fmtFecha(k)}</td><td>${D.cintura[k]} cm</td>
      <td style="color:${d===null?'var(--tx3)':d<0?'var(--green)':'var(--tx2)'}">${d===null?'—':(d>0?'+':'')+d.toFixed(1)}</td></tr>`;
  });
  return h+'</table>';
}
function grafico(){
  const W=340,H=200,M={t:14,r:12,b:24,l:28};
  const iw=W-M.l-M.r, ih=H-M.t-M.b, yMin=80,yMax=110;
  const X=i=>M.l+i*iw/(CURVA.length-1), Y=v=>M.t+ih-(v-yMin)/(yMax-yMin)*ih;
  let g='';
  for(let v=82;v<=106;v+=6){
    g+=`<line x1="${M.l}" y1="${Y(v).toFixed(1)}" x2="${W-M.r}" y2="${Y(v).toFixed(1)}" stroke="#33332f" stroke-width="1"/>`;
    g+=`<text x="${M.l-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#8f8e85">${v}</text>`;
  }
  [0,7,15,21,26].forEach(i=>{ const d=parse(START); d.setDate(d.getDate()+i*7);
    g+=`<text x="${X(i).toFixed(1)}" y="${H-M.b+15}" text-anchor="middle" font-size="8.5" fill="#8f8e85">${fmtFecha(iso(d))}</text>`; });
  g+=`<line x1="${M.l}" y1="${Y(META).toFixed(1)}" x2="${W-M.r}" y2="${Y(META).toFixed(1)}" stroke="#3987e5" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>`;
  g+=`<line x1="${X(15).toFixed(1)}" y1="${M.t}" x2="${X(15).toFixed(1)}" y2="${M.t+ih}" stroke="#33332f" stroke-width="1.5"/>`;
  g+=`<text x="${(X(15)+4).toFixed(1)}" y="${M.t+9}" font-size="8.5" fill="#8f8e85">1 dic</text>`;
  g+=`<path d="${CURVA.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="#3987e5" stroke-width="2" stroke-linejoin="round"/>`;
  // real
  const pts=[];
  CURVA.forEach((_,i)=>{ const d=parse(START); d.setDate(d.getDate()+i*7);
    const m=media7(iso(d)); if(m!==null) pts.push([i,m]); });
  if(pts.length>1) g+=`<path d="${pts.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#d95926" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach(p=>{ g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.4" fill="#d95926" stroke="#1a1a19" stroke-width="1.6"/>`; });
  g+=`<circle cx="${X(0)}" cy="${Y(108).toFixed(1)}" r="3.4" fill="#3987e5"/>`;
  g+=`<text x="${W-M.r}" y="${(Y(META)-5).toFixed(1)}" text-anchor="end" font-size="9" font-weight="600" fill="#c3c2b7">meta 82,5</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function records(){
  const best={};
  Object.entries(D.log).forEach(([k,L])=>{
    const dia=+k.split('d')[1], ciclo=+k.slice(1).split('d')[0];
    const P=PLAN[dia]; if(!P) return;
    const V=P.v[variante(ciclo)]; if(!V) return;
    exDia(dia,variante(ciclo)).forEach((x,i)=>{
      const le=L['e'+i]; if(!le||!le.sets) return;
      le.sets.forEach(s=>{ if(!s||!s.w||!s.r) return;
        const nm=(le.n||x.n).replace(/^SS\d · /,'');
        if(!best[nm]||s.w>best[nm].w||(s.w===best[nm].w&&s.r>best[nm].r)) best[nm]={n:nm,w:s.w,r:s.r};
      });
    });
  });
  return Object.values(best).sort((a,b)=>b.w-a.w);
}
function ajusta(n){ D.offset+=n; save(); toast('Ciclo ajustado'); VER=hoyISO(); renderTodo(); }
function exportar(){
  const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='mi-plan-'+hoyISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
      if(!o||o.v!==1) throw 0;
      if(!confirm('Se reemplazarán los datos actuales por los del archivo. ¿Seguro?')) return;
      D=o; save(); toast('Datos importados'); renderTodo();
    }catch(err){ toast('Archivo no válido'); } };
  r.readAsText(f); inp.value='';
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^ss\d\s*\u00b7\s*/,'');
/* nombres del plan que no coinciden con ninguna clave */
const ALIASEJ={'press de hombro':'press militar'};
function buscaGuia(n){ const q=norm(n);
  const a=Object.keys(ALIASEJ).find(k=>q.includes(k));
  if(a) return GUIA.find(x=>x.k===ALIASEJ[a]) || null;
  return GUIA.find(x=>q.includes(x.k)) || (q.length>3?GUIA.find(x=>norm(x.t).includes(q)):null) || null; }

/* lo que tienes: mancuernas, comba, esterilla, rueda y una silla */

const EJINFO={

function limpiaNombre(n){ return n.replace(/^SS\d · /,''); }
function infoEj(n){ const G=buscaGuia(limpiaNombre(n)); return G&&EJINFO[G.k]?{G:G,i:EJINFO[G.k]}:null; }
/* alternativas del mismo patrón, con tu material, sin las descartadas ni las que ya haces hoy */
function alternativas(n,enSesion){
  const I=infoEj(n); if(!I) return [];
  const fuera=(enSesion||[]).map(x=>norm(limpiaNombre(x)));
  return GUIA.filter(o=>{
    const inf=EJINFO[o.k];
    if(!inf || o.k===I.G.k) return false;
    if(inf[0]!==I.i[0]) return false;
    if(MATERIAL.indexOf(inf[2])<0) return false;
    if(D.veto.indexOf(o.t)>=0) return false;
    return !fuera.some(f=>f.includes(o.k));
  }).sort((a,b)=>Math.abs(EJINFO[a.k][1]-I.i[1])-Math.abs(EJINFO[b.k][1]-I.i[1]));
}
/* el mismo patrón, un escalón más fácil o más difícil */
function vecino(n,dir){
  const I=infoEj(n); if(!I) return null;
  const L=alternativas(n).filter(o=>dir<0?EJINFO[o.k][1]<I.i[1]:EJINFO[o.k][1]>I.i[1]);
  return L.length?L[0]:null;
}

/* ══════════════════ CAMBIOS DE EJERCICIO ══════════════════ */
function claveSw(dia,vr,i){ return 'd'+dia+'v'+vr+'e'+i; }
/* la sesión con los cambios que hayas guardado ya aplicados */
function exDia(dia,vr){
  return PLAN[dia].v[vr].ex.map((x,i)=>{
    const n=D.cambios[claveSw(dia,vr,i)];
    if(!n) return x;
    const pref=(x.n.match(/^SS\d · /)||[''])[0];
    return {n:pref+n, s:x.s, r:x.r, nt:'', sw:x.n};
  });
}
function nombreEj(i){
  const st=estado(VER);
  const x=exDia(st.dia,variante(st.ciclo))[i];
  return x?x.n:'';
}
function cambiaEjercicio(dia,vr,i){
  const EX=exDia(dia,vr), x=EX[i], orig=PLAN[dia].v[vr].ex[i];
  const nombre=limpiaNombre(x.n), I=infoEj(nombre);
  const alts=alternativas(nombre, EX.map(e=>e.n));

  let h=`<p class="sh-t">Cambiar ejercicio</p>
  <p class="sh-s">${esc(nombre)}${I?' · '+PATRONES[I.i[0]].toLowerCase()+' · '+NIVELES[I.i[1]-1].toLowerCase():''}</p>`;

  if(x.sw) h+=`<div class="gbox ok"><div class="gt">Ya está cambiado</div>
    <p>Estás haciendo <b>${esc(nombre)}</b> en lugar de <b>${esc(limpiaNombre(orig.n))}</b>.</p>
    <button class="btn-s" style="margin-top:9px" onclick="deshaceEj(${dia},'${vr}',${i})">Volver al original</button></div>`;

  if(!I){
    h+=`<div class="gbox"><p>Este bloque combina varios ejercicios o es de cardio, así que no tiene
      un cambio directo. Si hoy no puedes hacerlo, cámbialo por otro día del ciclo o usa el botón de
      mover el ciclo un día.</p></div>`;
  }else if(!alts.length){
    h+=`<div class="gbox"><p>No hay otra alternativa de <b>${esc(PATRONES[I.i[0]].toLowerCase())}</b>
      que puedas hacer con mancuernas, comba, esterilla y una silla. Si lo descartas, quedará el hueco vacío.</p></div>`;
  }else{
    h+=`<h3 style="margin-top:4px">Alternativas · mismo patrón</h3>`;
    alts.slice(0,6).forEach(o=>{
      const inf=EJINFO[o.k];
      h+=`<div class="slot" style="display:flex;gap:10px;align-items:center">
        <div style="flex:1;min-width:0" onclick="fichaGuia('${o.k}')">
          <div class="sn">${esc(o.t)}</div>
          <div class="sm">${NIVELES[inf[1]-1]} · ${inf[2]} · toca para ver la técnica</div>
        </div>
        <button class="btn-s btn-p" onclick="eligeEj(${dia},'${vr}',${i},'${esc(o.t).replace(/'/g,'')}')">Cambiar</button>
      </div>`;
    });
    h+=`<p class="muted">Se mantienen las series y las repeticiones del hueco (${orig.s>1?orig.s+' × ':''}${esc(orig.r)}).
      El cambio se guarda para el <strong>día ${dia}, variante ${vr}</strong>: la próxima vez que toque esta sesión ya saldrá cambiado.</p>`;
  }

  if(I) h+=`<button class="btn-w" style="margin:6px 0 8px" onclick="vetaEj('${esc(I.G.t).replace(/'/g,'')}',${dia},'${vr}',${i})">No quiero volver a hacer ${esc(I.G.t)}</button>`;
  h+=`<button class="btn-p btn-w" onclick="cerrar()">Cerrar</button>`;
  abre(h);
}
function eligeEj(dia,vr,i,n){
  D.cambios[claveSw(dia,vr,i)]=n; save(); vibra(18);
  cerrar(); renderHoy(); renderMas(); toast('Cambiado por '+n);
}
function deshaceEj(dia,vr,i){
  delete D.cambios[claveSw(dia,vr,i)]; save();
  cerrar(); renderHoy(); renderMas(); toast('Vuelto al original');
}
function vetaEj(t,dia,vr,i){
  if(D.veto.indexOf(t)<0) D.veto.push(t);
  save();
  const alts=alternativas(t, exDia(dia,vr).map(e=>e.n));
  if(alts.length) eligeEj(dia,vr,i,alts[0].t);
  else { cerrar(); renderHoy(); renderMas(); toast('Descartado'); }
}
function quitaVeto(t){ D.veto=D.veto.filter(x=>x!==t); save(); renderMas(); toast('Vuelve a estar disponible'); }
function reponEj(k){ /* deshace todos los cambios */
  if(!confirm('Se deshacen todos los cambios de ejercicio y vuelve el plan original. ¿Seguro?')) return;
  D.cambios={}; save(); renderTodo(); toast('Plan original restaurado');
}

function cuerpoGuia(G){
  const inf=EJINFO[G.k];
  let h='';
  if(inf) h+=`<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:12px">
    <span class="pill p-f">${esc(PATRONES[inf[0]])}</span>
    <span class="pill p-r">${NIVELES[inf[1]-1]}</span>
    <span class="pill p-r">${esc(inf[2])}</span></div>`;
  h+=`<div class="vid" id="vidBox">
    <button class="btn-p" onclick="cargaVideo('${esc(G.y).replace(/'/g,'')}')">▶  Ver vídeo</button>
  </div>
  <a class="btn btn-gh btn-w" style="display:block;text-align:center;text-decoration:none;margin-bottom:14px"
     href="https://www.youtube.com/results?search_query=${encodeURIComponent(G.y)}" target="_blank" rel="noopener">Abrir búsqueda en YouTube</a>
  <div class="gbox"><div class="gt">Posición de partida</div><p>${esc(G.s)}</p></div>
  <div class="gbox ok"><div class="gt">Ejecución</div><p>${esc(G.e)}</p></div>
  <div class="gbox err"><div class="gt">Errores típicos</div><p>${esc(G.x)}</p></div>
  <div class="gbox"><div class="gt">Qué debes notar</div><p>${esc(G.n)}</p></div>`;
  const f=vecino(G.t,-1), d=vecino(G.t,1);
  if(f||d){
    h+=`<h3>Subir o bajar el listón</h3><div class="grid2" style="margin-bottom:10px">
      ${f?`<button onclick="fichaGuia('${f.k}')">↓  ${esc(f.t)}</button>`:'<div></div>'}
      ${d?`<button onclick="fichaGuia('${d.k}')">↑  ${esc(d.t)}</button>`:'<div></div>'}</div>
    <p class="muted">Mismo patrón, un escalón más fácil o más exigente. Tocando ves su técnica.</p>`;
  }
  return h;
}
function fichaEjercicio(dia,vr,i){
  const x=exDia(dia,vr)[i], G=buscaGuia(limpiaNombre(x.n));
  let h=`<p class="sh-t">${esc(x.n)}</p><p class="sh-s">${x.s>1?x.s+' × ':''}${esc(x.r)}${x.nt?' · '+esc(x.nt):''}${x.sw?' · en lugar de '+esc(x.sw):''}</p>`;
  h+= G ? cuerpoGuia(G)
        : `<div class="gbox"><p>Este bloque no tiene ficha individual porque combina varios ejercicios. Abre la ficha de cada movimiento desde los días de fuerza.</p></div>`;
  h+=`<div class="grid2" style="margin-top:12px">
    <button class="btn-p" onclick="cambiaEjercicio(${dia},'${vr}',${i})">Cambiar por otro</button>
    <button onclick="cerrar()">Cerrar</button></div>`;
  abre(h);
}
/* ficha suelta, desde el catálogo o desde las alternativas */
function fichaGuia(k){
  const G=GUIA.find(g=>g.k===k); if(!G) return;
  let h=`<p class="sh-t">${esc(G.t)}</p><p class="sh-s">Ficha del catálogo</p>`+cuerpoGuia(G);
  h+=`<button class="btn-p btn-w" style="margin-top:12px" onclick="cerrar()">Cerrar</button>`;
  abre(h);
}

const RECX={}; RECETAS.forEach(r=>RECX[r.id]=r);
const HUECOS=[['des','Desayuno'],['com','Comida'],['post','Post-entreno'],['mer','Merienda'],['cen','Cena']];
const DIAS_SEM=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

/* menú semanal: 7 días × los 5 huecos */
const MENU=[
 ['d1','c1','p1','m1','n1'],
 ['d3','c2','p1','m2','n2'],
 ['d2','c3','p3','m3','n3'],
 ['d4','c4','p1','m4','n4'],
 ['d5','c5','p1','m5','n5'],
 ['d6','c6','p2','m6','n6'],
 ['d3','c10','p3','m1','n7']
];

/* ══════════════════ CÁLCULO DE RECETAS ══════════════════ */
function macros(ing){
  let kcal=0,p=0;
  ing.forEach(([n,g])=>{ const a=ALIMX[n]; if(!a) return; kcal+=a[1]*g/100; p+=a[2]*g/100; });
  return {kcal:Math.round(kcal), p:Math.round(p)};
}
function escalable(n){ const a=ALIMX[n]; return !!(a && ESCALABLE[a[3]]); }
/* ingredientes de una receta con un factor aplicado solo a hidratos, fruta y grasa */
function ingEscalados(r,f){
  return r.ing.map(([n,g])=>[n, escalable(n)&&f!==1 ? Math.max(5,Math.round(g*f/5)*5) : g]);
}
/* el día del menú, ajustado al objetivo de hoy */
function diaMenu(i){
  const O=objetivosDia();
  const recs=MENU[i].map(id=>RECX[id]);
  let base=0, esc=0;
  recs.forEach(r=>{ const m=macros(r.ing); base+=m.kcal;
    esc+=macros(r.ing.filter(x=>escalable(x[0]))).kcal; });
  let f=1;
  if(esc>0) f=Math.min(1.6,Math.max(0.6,1+(O.kcal-base)/esc));
  const comidas=recs.map(r=>{ const ing=ingEscalados(r,f); const m=macros(ing);
    return {r, ing, kcal:m.kcal, p:m.p}; });
  const T=comidas.reduce((a,c)=>({kcal:a.kcal+c.kcal,p:a.p+c.p}),{kcal:0,p:0});
  return {comidas, kcal:T.kcal, p:T.p, f, obj:O};
}

let diaSel=(new Date().getDay()+6)%7, filtroRec='todas';

function vistaMenu(){
  const d=diaMenu(diaSel), O=d.obj;
  let h=`<div class="sug" style="margin-bottom:12px">`;
  DIAS_SEM.forEach((n,i)=>{ h+=`<button class="${i===diaSel?'btn-p':''}" onclick="diaSel=${i};renderDieta()">${n.slice(0,3)}</button>`; });
  h+=`</div>`;

  const pk=Math.min(100,d.kcal/O.kcal*100), pp=Math.min(100,d.p/O.prot*100);
  h+=`<div class="grid2" style="margin-bottom:12px">
    <div class="stat"><div class="l">Calorías del día</div><div class="v">${d.kcal}</div>
      <div class="n">objetivo ${O.kcal}</div><div class="bar"><i style="width:${pk}%"></i></div></div>
    <div class="stat"><div class="l">Proteína</div><div class="v">${d.p} g</div>
      <div class="n">objetivo ${O.prot} g</div><div class="bar"><i style="width:${pp}%;background:${d.p>=O.prot?'var(--green)':'var(--blue)'}"></i></div></div>
  </div>`;

  d.comidas.forEach((c,j)=>{
    h+=`<div class="slot" onclick="fichaReceta('${c.r.id}',${diaSel})">
      <div class="sl">${HUECOS[j][1]}</div>
      <div class="sn">${esc(c.r.n)}</div>
      <div class="sm">${c.kcal} kcal · ${c.p} g prot. · ${c.r.min} min${c.r.batch?' · para varios días':''}</div>
    </div>`;
  });

  h+=`<div class="grid2" style="margin:14px 0 4px">
    <button class="btn-p" onclick="listaCompra()">🛒  Lista de la compra</button>
    <button onclick="registraDia(${diaSel})">Registrar el día entero</button>
  </div>`;
  h+=`<div class="box g">Las cantidades de arroz, patata, pan, fruta y aceite se ajustan solas a tu objetivo de hoy
    (${O.kcal} kcal). La proteína y la verdura no se tocan nunca.
    ${d.f!==1?`Hoy van al <strong>${Math.round(d.f*100)} %</strong> de la ración base.`:''}</div>`;
  h+=`<div class="box">Pesos <strong>en crudo</strong> para carne, pescado, arroz y pasta. Es como se pesa al cocinar,
    y es lo que hace que los números cuadren.</div>`;
  return h;
}

function vistaRecetas(){
  const F=[['todas','Todas'],['des','Desayuno'],['com','Comida'],['post','Post'],['mer','Merienda'],['cen','Cena']];
  let h=`<div class="sug" style="margin-bottom:12px">`;
  F.forEach(([k,n])=>{ h+=`<button class="${filtroRec===k?'btn-p':''}" onclick="filtroRec='${k}';renderDieta()">${n}</button>`; });
  h+=`</div>`;
  const L=RECETAS.filter(r=>filtroRec==='todas'||r.m===filtroRec);
  L.forEach(r=>{ const m=macros(r.ing);
    h+=`<div class="slot" onclick="fichaReceta('${r.id}',null)">
      <div class="sl">${HUECOS.find(x=>x[0]===r.m)[1]} · ${r.min} min${r.batch?' · batch cooking':''}</div>
      <div class="sn">${esc(r.n)}</div>
      <div class="sm">${m.kcal} kcal · ${m.p} g prot. · ${r.ing.length} ingredientes</div>
    </div>`; });
  h+=`<div class="box" style="margin-top:14px">Todas son de <strong>20 minutos o menos</strong>. Las marcadas
    <em>batch cooking</em> están pensadas para multiplicarlas por tres y dejar la semana resuelta.</div>`;
  return h;
}

/* ficha de una receta · dia = índice del menú (con cantidades ajustadas) o null (ración base) */
function fichaReceta(id,dia,mult){
  const r=RECX[id]; if(!r) return;
  mult=mult||1;
  let ing;
  if(dia!==null&&dia!==undefined){ const d=diaMenu(dia); const c=d.comidas.find(x=>x.r.id===id); ing=c?c.ing:r.ing; }
  else ing=r.ing;
  if(mult!==1) ing=ing.map(([n,g])=>[n,Math.max(1,Math.round(g*mult))]);
  const M=macros(ing);
  window.__ficha={id,dia,mult};

  let h=`<p class="sh-t">${esc(r.n)}</p>
  <p class="sh-s">${HUECOS.find(x=>x[0]===r.m)[1]} · ${r.min} min · ${M.kcal} kcal · ${M.p} g de proteína</p>
  <div class="sug" style="margin-bottom:12px">
    <button class="${mult===0.75?'btn-p':''}" onclick="fichaReceta('${id}',${dia===null||dia===undefined?'null':dia},0.75)">Ración ×0,75</button>
    <button class="${mult===1?'btn-p':''}" onclick="fichaReceta('${id}',${dia===null||dia===undefined?'null':dia},1)">×1</button>
    <button class="${mult===1.5?'btn-p':''}" onclick="fichaReceta('${id}',${dia===null||dia===undefined?'null':dia},1.5)">×1,5</button>
  </div>
  <h3 style="margin-top:4px">Ingredientes</h3><table>`;
  ing.forEach(([n,g])=>{ const a=ALIMX[n]; const k=Math.round(a[1]*g/100), pr=Math.round(a[2]*g/100);
    const ud=a[4]&&g/a[5]>=1?` <span class="muted">(${(g/a[5]).toFixed(g/a[5]%1?1:0).replace('.',',')} ${a[4]})</span>`:'';
    h+=`<tr><td class="k">${g} g${ud}</td><td>${esc(n)}<br><span class="muted">${k} kcal · ${pr} g prot.</span></td></tr>`; });
  h+=`<tr><td class="k">Total</td><td><strong>${M.kcal} kcal · ${M.p} g de proteína</strong></td></tr></table>
  <h3>Cómo se hace</h3><div class="card"><ol style="margin:0;padding-left:19px;color:var(--tx2);font-size:14.5px">`;
  r.pasos.forEach(p=>{ h+=`<li style="margin-bottom:6px">${esc(p)}</li>`; });
  h+=`</ol></div>`;

function claveAlim(n){ return norm(n.replace(/\s*\(.*?\)/g,'')); }
/* busca el alimento del que habla un trozo de frase */
function buscaEnFrase(q){
  let mejor=null, largo=0;
  ALIM.forEach(a=>{ const k=claveAlim(a[0]);
    if(k.length>2 && q.includes(k) && k.length>largo){ mejor=a; largo=k.length; } });
  if(mejor) return mejor;
  Object.keys(ALIAS).forEach(k=>{
    if(k.length>largo && new RegExp('(^|[^a-z])'+k+'([^a-z]|$)').test(q)){ mejor=ALIMX[ALIAS[k]]; largo=k.length; } });
  if(mejor) return mejor;
  ALIM.forEach(a=>{ claveAlim(a[0]).split(' ').forEach(w=>{
    if(w.length>4 && w.length>largo && new RegExp('(^|[^a-z])'+w).test(q)){ mejor=a; largo=w.length; } }); });
  return mejor;
}
function calcLocal(txt){
  const partes=txt.split(/[,;\n]|\s+y\s+|\s+con\s+|\s+m[a\u00e1]s\s+|\+/i);
  const items=[], perdidos=[];
  partes.forEach(t=>{
    t=t.trim(); if(!t) return;
    const q=norm(t);
    const mejor=buscaEnFrase(q);
    if(!mejor){ if(t.length>2) perdidos.push(t); return; }
    const m=q.match(/(\d+[.,]?\d*)\s*(g|gr|gramos|ml)\b/) ;
    let g;
    if(m) g=parseFloat(m[1].replace(',','.'));
    else{
      const mu=q.match(/(\d+[.,]?\d*|un|una|uno|dos|tres|cuatro|cinco|seis|medio|media)\s/);
      const n=mu?(NUMS[mu[1]]!==undefined?NUMS[mu[1]]:parseFloat(mu[1].replace(',','.'))):1;
      g=mejor[5]?n*mejor[5]:(mejor[3]==='ver'?150:100)*n;
    }
    items.push({a:mejor[0], g:Math.round(g), k100:mejor[1], p100:mejor[2]});
  });
  if(!items.length){
    abre(`<p class="sh-t">No he reconocido nada</p>
    <div class="gbox err"><p>No he encontrado ningún alimento de la lista en esa frase. Prueba a meterlo con el buscador.</p></div>
    <button class="btn-p btn-w" style="margin-bottom:8px" onclick="formComida({n:'',kcal:0,p:0,src:'man'})">Meterlo a mano</button>
    <button class="btn-w" onclick="cerrar()">Cerrar</button>`); return;
  }
  ING=items;
  formComida({n:txt.length<42?txt:items.map(i=>i.a.replace(/\s*\(.*?\)/g,'')).slice(0,3).join(' + '),
    src:'txt', deIng:1, conf:'media',
    aviso:(perdidos.length?'No he reconocido: '+perdidos.join(', ')+'. ':'')+'Cantidades estimadas sin API: repásalas.'});
}

// Extrae el primer objeto JSON que aparezca en un texto, aunque venga con ``` o con prosa alrededor
function sacaJSON(t){
  if(!t) return null;
  t=t.replace(/```json|```/g,'');
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<=a) return null;
  try{ return JSON.parse(t.slice(a,b+1)); }catch(err){ return null; }
}
async function llamaAPI(cuerpo){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':D.api.key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(cuerpo)});
  if(!r.ok){
    const t=await r.text();
    let msg='Error '+r.status;
    if(r.status===401) msg='La clave de API no es válida. Revísala en Más → Reconocimiento por foto.';
    else if(r.status===404) msg='Ese modelo no existe o no está disponible en tu cuenta. Prueba con claude-haiku-4-5 o claude-sonnet-5.';
    else if(r.status===429) msg='Demasiadas peticiones o sin saldo. Espera un momento o revisa tu saldo en console.anthropic.com.';
    else if(r.status>=500) msg='La API está dando error ahora mismo. Prueba en un minuto.';
    const e=new Error(msg+'\n\n'+t.slice(0,200)); e.status=r.status; e.cuerpo=t; throw e;
  }
  return r.json();
}
async function pideIA(o){
  window.__ult=o;
  abre(`<p class="sh-t">${o.texto?'Calculando':'Analizando la foto'}</p><p class="sh-s">Suele tardar unos segundos.</p>
    <div class="gbox"><p><span class="spin"></span>Preguntando a Claude…</p></div>`);
  const conFoto=!!o.b64, modelo=D.api.model||'claude-haiku-4-5', SYS=sysIA(conFoto);
  const contenido=[];
  if(conFoto) contenido.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:o.b64.split(',')[1]}});
  contenido.push({type:'text',text:(conFoto
      ? '¿Qué hay en este plato? Desglósalo en ingredientes con gramos.'
      : 'Comida: "'+o.texto+'". Desglósala en ingredientes con gramos.')
    + (o.extra?'\nAclaración del usuario, tiene prioridad sobre lo que hayas supuesto: '+o.extra:'')});
  const msgs=[{role:'user',content:contenido}];
  try{
    let x=null;
    try{
      // Vía principal: herramienta con esquema. Funciona en todos los modelos.
      const j=await llamaAPI({model:modelo, max_tokens:1500,
        system:SYS+'\nDevuelve el resultado llamando a la herramienta "registrar_comida".',
        messages:msgs, tools:[HERR], tool_choice:{type:'tool',name:'registrar_comida'}});
      const b=(j.content||[]).find(c=>c.type==='tool_use');
      if(b) x=b.input;
      if(!x) x=sacaJSON((j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n'));
    }catch(err){
      // Plan B: sin herramientas, pidiendo el JSON en el texto
      if(err.status===400){
        const j2=await llamaAPI({model:modelo, max_tokens:1500, system:SYS+JSONMIN, messages:msgs});
        x=sacaJSON((j2.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n'));
      } else throw err;
    }
    const items=(x&&Array.isArray(x.items))?x.items:[];
    if(!x || (!items.length && typeof x.kcal!=='number'))
      throw new Error('La respuesta no vino en el formato esperado. Puedes meterlo a mano y seguir.');
    ING=items.map(i=>{
      const a=ALIMX[i.a], g=+i.g||0;
      const k100=a?a[1]:(+i.kcal100 || (g?Math.round((+i.kcal||0)*100/g):0));
      const p100=a?a[2]:(+i.p100   || (g?Math.round((+i.p||0)*100/g*10)/10:0));
      return {a:i.a||'Ingrediente', g:Math.round(g), k100:k100, p100:p100};
    }).filter(i=>i.g>0);
    formComida({n:x.plato||o.texto||'Comida', img:o.mini, src:conFoto?'ia':'txt', deIng:1,
                kcal:Math.round(x.kcal||0), p:Math.round(x.p||0),
                conf:x.conf||'media', aviso:x.aviso||''});
  }catch(err){
    abre(`<p class="sh-t">No ha podido calcularlo</p>
      <div class="gbox err"><p>${esc(err.message)}</p></div>
      ${o.texto?`<button class="btn-p btn-w" style="margin-bottom:8px" onclick="calcLocal(${JSON.stringify(o.texto).replace(/"/g,'&quot;')})">Calcularlo sin la API</button>`:''}
      <button class="btn-w" style="margin-bottom:8px" onclick="ING=[];formComida({n:'',kcal:0,p:0,src:'man'})">Meterlo a mano</button>
      <button class="btn-w" onclick="cerrar()">Cerrar</button>`);
  }
}

}
function formComida(d){
  d=d||{n:'',kcal:0,p:0,src:'man'};
  if(!d.deIng) ING=[];
  const T=totING(), hayIng=ING.length>0;
  const kcal=hayIng?Math.round(T.kcal):(d.kcal||''), prot=hayIng?Math.round(T.p):(d.p||'');
  const tit={ia:'Revisa y corrige',txt:'Revisa las cantidades',rec:'Ajusta la ración'}[d.src]||'Añadir comida';
  const sub={ia:'La foto se equivoca a menudo con el aceite y el tamaño de la ración. Corrige los gramos: los totales se recalculan solos.',
             txt:'Corrige los gramos que no cuadren; los totales se recalculan solos.',
             rec:'Cambia los gramos que hayas variado al cocinar.'}[d.src]
            ||'A mano, con el buscador de alimentos o desde tus favoritos.';
  let h=`<p class="sh-t">${tit}</p><p class="sh-s">${sub}</p>`;
  if(d.img) h+=`<img src="${d.img}" style="width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin-bottom:12px">`;
  if(d.conf) h+=`<div class="gbox"><div class="gt">Confianza de la estimación · ${esc(d.conf)}</div>
    <p>${d.src==='ia'?'Lo que ha visto en la foto está abajo, ingrediente a ingrediente.':'Desglose calculado abajo.'}</p></div>`;
  if(d.aviso) h+=`<div class="gbox err"><div class="gt">Aviso</div><p>${esc(d.aviso)}</p></div>`;
  h+=`<div class="fld"><label>Qué has comido</label><input id="fN" value="${esc(d.n||'')}" placeholder="Pollo con arroz y ensalada"></div>
  <label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:700;margin:14px 0 7px">Ingredientes</label>
  <div id="ingList" class="inglist">${filasIng()}</div>
  <div class="fld" style="margin-top:10px"><label>Añadir alimento (busca y toca)</label>
    <input id="fB" placeholder="pollo, arroz, aceite, yogur…" oninput="buscaAlim(this.value)">
    <div class="res" id="fR" style="display:none"></div></div>
  <div class="grid2">
    <div class="fld"><label>Calorías</label><input id="fK" type="number" inputmode="numeric" value="${kcal}" placeholder="0"></div>
    <div class="fld"><label>Proteína (g)</label><input id="fP" type="number" inputmode="numeric" value="${prot}" placeholder="0"></div>
  </div>`;
  if(D.favs.length&&d.src==='man'){
    h+=`<label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:700;margin:4px 0 7px">Tus favoritos</label><div class="sug">`;
    D.favs.forEach((f,i)=>{ h+=`<button onclick="ponFav(${i})">${esc(f.n)} · ${f.kcal}</button>`; });
    h+=`</div>`;
  }
  if(d.src==='ia'||d.src==='txt'){
    h+=`<div class="fld"><label>¿Se ha equivocado en algo?</label>
      <input id="fAfina" placeholder="el pollo eran 250 g y no llevaba aceite">
      <button class="btn-s" style="margin-top:7px" onclick="afinar()">Volver a preguntar con esta aclaración</button></div>`;
  }
  h+=`<button class="btn-p btn-w" style="margin:14px 0 8px" onclick="confirmaComida()">Guardar</button>
  <div class="grid2">
    <button onclick="favDesdeForm()">Añadir a favoritos</button>
    <button onclick="cerrar()">Cancelar</button>
  </div>`;
  abre(h);
  window.__img=d.img||null;
  window.__src=d.src;
}
function buscaAlim(q){
  const R=$('#fR'); q=norm(q.trim());
  if(q.length<2){ R.style.display='none'; return; }
  const m=[]; ALIM.forEach((a,i)=>{ if(m.length<10 && norm(a[0]).includes(q)) m.push(i); });
  if(!m.length){ R.style.display='none'; return; }
  R.style.display='block';
  R.innerHTML=m.map(i=>{ const a=ALIM[i];
    return `<div onclick="addIng(${i})"><b>${esc(a[0])}</b><br>${a[1]} kcal · ${a[2]} g prot. por 100 g${a[4]?' · 1 '+esc(a[4])+' = '+a[5]+' g':''}</div>`;
  }).join('');
}
function ponFav(i){ const f=D.favs[i];
  ING=[]; const L=$('#ingList'); if(L) L.innerHTML=filasIng();
  $('#fN').value=f.n; $('#fK').value=f.kcal; $('#fP').value=f.p; }
function favDesdeForm(){
  const n=$('#fN').value.trim(); if(!n){ toast('Ponle nombre primero'); return; }
  guardaFav(n,$('#fK').value||0,$('#fP').value||0);
}
function confirmaComida(){
  const n=$('#fN').value.trim()||'Comida';
  const kcal=Math.round(+$('#fK').value||0), p=Math.round(+$('#fP').value||0);
  if(kcal<=0){ toast('Pon las calorías'); return; }
  addComida({n,kcal,p,img:window.__img,src:window.__src,
             items:ING.map(i=>({a:i.a,g:i.g}))});
  ING=[]; cerrar(); toast('Comida registrada');
}

/* — ajustes de la API — */
function ajustesIA(desdeFoto){
  abre(`<p class="sh-t">Reconocimiento por foto</p>
  <p class="sh-s">${desdeFoto?'Necesitas una clave de Claude para usar la cámara. Se guarda solo en este móvil.':'Tu clave se guarda solo en este móvil, nunca se sube a ningún sitio.'}</p>
  <div class="gbox"><div class="gt">Cómo conseguir la clave</div>
    <p>1 · Entra en <b>console.anthropic.com</b> y crea una cuenta.<br>
       2 · Mete 5 $ de saldo en <b>Billing</b>.<br>
       3 · En <b>API keys</b> → <b>Create key</b>, cópiala y pégala aquí abajo.</p></div>
  <div class="gbox"><div class="gt">Cuánto cuesta</div>
    <p>Con el modelo Haiku, cada foto sale por unos <b>0,003 $</b>. Aunque hagas 4 fotos al día hasta la boda, son menos de <b>3 $ en total</b>. Con 5 $ te sobra.</p></div>
  <div class="fld"><label>Clave de API</label><input id="aK" type="password" value="${esc(D.api.key||'')}" placeholder="sk-ant-..."></div>
  <div class="fld"><label>Modelo</label><input id="aM" value="${esc(D.api.model||'claude-haiku-4-5')}" placeholder="claude-haiku-4-5"></div>
  <p class="muted" style="margin:-4px 0 14px">Si algún día ese modelo deja de existir, cámbialo aquí por el que toque (por ejemplo claude-sonnet-5). No hace falta tocar nada más.</p>
  <button class="btn-p btn-w" style="margin-bottom:8px" onclick="guardaIA()">Guardar</button>
  <div class="grid2"><button onclick="probarIA()">Probar la clave</button><button onclick="cerrar()">Cerrar</button></div>`);
}
function guardaIA(){
  D.api.key=$('#aK').value.trim(); D.api.model=$('#aM').value.trim()||'claude-haiku-4-5';
  save(); toast('Guardado'); cerrar(); renderDieta(); renderMas();
}
async function probarIA(){
  const k=$('#aK').value.trim(), m=$('#aM').value.trim()||'claude-haiku-4-5';
  if(!k){ toast('Pega la clave primero'); return; }
  toast('Probando…');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:m,max_tokens:8,messages:[{role:'user',content:'di ok'}]})});
    toast(r.ok?'Funciona correctamente' : (r.status===401?'Clave incorrecta':r.status===404?'Ese modelo no existe':'Error '+r.status));
  }catch(err){ toast('Sin conexión con la API'); }
}

/* ══════════════════ ARRANQUE ══════════════════ */
function nav(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  const T={hoy:['Hoy',''],ciclo:['El ciclo',''],peso:['Peso',''],dieta:['Dieta',''],mas:['Más','']};
  if(v!=='hoy'){ $('#hTitle').textContent=T[v][0]; $('#hSub').textContent='Ciclo '+estado(hoyISO()).ciclo+' · día '+estado(hoyISO()).dia; }
  else renderHoy();
  window.scrollTo({top:0});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));

function renderTodo(){ renderHoy(); renderCiclo(); renderPeso(); renderDieta(); renderMas(); }
renderTodo();

// si el día cambia mientras la app está abierta
setInterval(()=>{ const h=hoyISO(); if(!window.__d) window.__d=h;
  if(window.__d!==h){ window.__d=h; VER=h; renderTodo(); } },60000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
